version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: planora_postgres
    restart: always
    environment:
      POSTGRES_USER: planora_user
      POSTGRES_PASSWORD: planora_password
      POSTGRES_DB: planora_db
    ports:
      - "5432:5432"
    volumes:
      - planora_pgdata:/var/lib/postgresql/data

volumes:
  planora_pgdata:
